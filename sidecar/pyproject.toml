[project]
name = "openlark-sidecar"
version = "0.1.0"
description = "Parakeet-MLX inference daemon for OpenLark"
requires-python = ">=3.11,<3.14"
dependencies = [
    "parakeet-mlx>=0.3.5",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
