name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow (icon generation)
        run: pip install Pillow

      - name: Show Swift version
        run: swift --version

      - name: Import release signing identity
        env:
          P12_BASE64: ${{ secrets.RELEASE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.RELEASE_P12_PASSWORD }}
        run: |
          # Decode the .p12 into a temp file
          P12_PATH="$RUNNER_TEMP/release.p12"
          echo "$P12_BASE64" | base64 --decode > "$P12_PATH"

          # Create an ephemeral keychain for this build
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make it the default search keychain so `security find-identity` finds it
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Import the .p12 and authorise codesign to use it without a UI prompt
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -A

          # Trust the cert for codesigning (user-level — no sudo needed)
          security find-certificate -c "OpenLark Release" -p "$KEYCHAIN_PATH" > "$RUNNER_TEMP/cert.pem"
          security add-trusted-cert -p codeSign -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/cert.pem" || true

          # Allow codesign to use the key without prompting
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          security find-identity -p codesigning -v "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"

      - name: Build
        env:
          SIGNING_IDENTITY: "OpenLark Release"
        run: ./scripts/build.sh

      - name: Zip the app + compute checksum
        id: artifact
        run: |
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent OpenLark.app OpenLark.app.zip
          shasum -a 256 OpenLark.app.zip > OpenLark.app.zip.sha256
          echo "sha256=$(cut -d' ' -f1 < OpenLark.app.zip.sha256)" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLark-${{ steps.ver.outputs.version }}
          path: |
            build/OpenLark.app.zip
            build/OpenLark.app.zip.sha256

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/OpenLark.app.zip
            build/OpenLark.app.zip.sha256
          generate_release_notes: true
          body: |
            ## Install

            1. Download `OpenLark.app.zip` below and unzip it.
            2. Drag `OpenLark.app` to `~/Applications`.
            3. Install [`uv`](https://github.com/astral-sh/uv) if you don't already have it:
               ```
               curl -LsSf https://astral.sh/uv/install.sh | sh
               ```
            4. Set up the inference daemon (one-time, downloads the ~600 MB model):
               ```
               git clone https://github.com/${{ github.repository }}.git
               cd openlark
               ./scripts/install-sidecar.sh
               ```
            5. Right-click `OpenLark.app` → **Open** (Gatekeeper, first launch only).
               Or: `xattr -dr com.apple.quarantine ~/Applications/OpenLark.app`
            6. Grant **Microphone**, **Accessibility** and **Input Monitoring** in System Settings → Privacy & Security.

            ## Verify

            SHA-256 of `OpenLark.app.zip`:
            ```
            ${{ steps.artifact.outputs.sha256 }}
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for details.
